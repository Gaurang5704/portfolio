<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d18"/>
      <stop offset="50%" stop-color="#181324"/>
      <stop offset="100%" stop-color="#0a080f"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg4)"/>

  <!-- Window Container -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="670" rx="12" fill="#151120" stroke="rgba(168,85,247,0.18)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="1080" height="48" rx="12" fill="#1b162a"/>
    <rect y="36" width="1080" height="12" fill="#1b162a"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(236,233,226,0.08)" stroke-width="1"/>

    <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="24" r="6" fill="#27c93f"/>

    <rect x="360" y="10" width="360" height="28" rx="6" fill="#0f0c17" stroke="rgba(236,233,226,0.08)"/>
    <text x="540" y="28" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle">stream.edusync.org/room/cs301-algorithms</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="622" fill="#110d1a"/>
      <line x1="220" y1="0" x2="220" y2="622" stroke="rgba(236,233,226,0.08)"/>

      <text x="24" y="38" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">EduSync Stream</text>
      <text x="24" y="56" fill="#a855f7" font-family="-apple-system, system-ui, sans-serif" font-size="10">REAL-TIME COLLABORATION</text>

      <rect x="16" y="80" width="188" height="34" rx="6" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.3)"/>
      <text x="36" y="102" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">Interactive Live Room</text>

      <text x="36" y="146" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Real-Time Whiteboard</text>
      <text x="36" y="186" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Collaborative Code Sync</text>
      <text x="36" y="226" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Student Latency Tracker</text>
      <text x="36" y="266" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Cross-Functional Delivery</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(250, 72)">
      <text x="0" y="24" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="22">Real-Time Classroom Collaboration Studio</text>
      <text x="0" y="46" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="13">Low-latency audio/video streaming, collaborative whiteboard &amp; synchronized state</text>

      <g transform="translate(0, 68)">
        <rect width="245" height="96" rx="8" fill="#1b162a" stroke="rgba(168,85,247,0.15)"/>
        <text x="18" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">WebSocket Latency</text>
        <text x="18" y="64" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">&lt; 85 ms</text>
        <text x="18" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">Sub-second sync time</text>

        <rect x="265" width="245" height="96" rx="8" fill="#1b162a" stroke="rgba(168,85,247,0.15)"/>
        <text x="283" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Active Participants</text>
        <text x="283" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">120 Students</text>
        <text x="283" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">Concurrent room scaling</text>

        <rect x="530" width="265" height="96" rx="8" fill="#1b162a" stroke="rgba(168,85,247,0.15)"/>
        <text x="548" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Cross-Team Delivery</text>
        <text x="548" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">4-Week MVP</text>
        <text x="548" y="84" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11">Agile sprint execution</text>
      </g>

      <!-- Live Stream Grid -->
      <g transform="translate(0, 186)">
        <rect width="520" height="385" rx="8" fill="#1b162a" stroke="rgba(236,233,226,0.08)"/>
        <!-- Stream Video Box -->
        <rect x="18" y="18" width="484" height="270" rx="6" fill="#0f0c17"/>
        <circle cx="260" cy="140" r="28" fill="rgba(168,85,247,0.3)"/>
        <polygon points="254,128 272,140 254,152" fill="#c084fc"/>
        <text x="36" y="44" fill="#ff5f56" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="11">● LIVE STREAMING</text>
        <text x="36" y="270" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-size="12">Lecture 14: Dynamic Programming &amp; Graph Models</text>

        <!-- Control Bar -->
        <rect x="18" y="306" width="484" height="60" rx="6" fill="#140f20"/>
        <circle cx="50" cy="336" r="16" fill="#a855f7"/>
        <rect x="80" y="331" width="100" height="10" rx="4" fill="rgba(236,233,226,0.15)"/>
        <rect x="360" y="324" width="120" height="24" rx="12" fill="rgba(168,85,247,0.2)"/>
        <text x="420" y="340" fill="#c084fc" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-anchor="middle">Share Screen</text>

        <!-- Right Chat Panel -->
        <rect x="535" width="260" height="385" rx="8" fill="#1b162a" stroke="rgba(236,233,226,0.08)"/>
        <text x="555" y="32" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="13">Room Chat (120)</text>
        <line x1="535" y1="46" x2="795" y2="46" stroke="rgba(236,233,226,0.08)"/>

        <text x="555" y="74" fill="#a855f7" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="11">Prof. Deshmukh:</text>
        <text x="555" y="92" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-size="11">Check line 42 on the sync editor.</text>

        <text x="555" y="126" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="11">Gaurang (Moderator):</text>
        <text x="555" y="144" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-size="11">State synchronizer latency is &lt; 50ms.</text>

        <rect x="547" y="335" width="236" height="36" rx="6" fill="#0f0c17" stroke="rgba(236,233,226,0.08)"/>
        <text x="560" y="358" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11">Ask a question...</text>
      </g>
    </g>
  </g>
</svg>
