<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#08090a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg2)"/>

  <!-- Window Container -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="670" rx="12" fill="#111317" stroke="rgba(236,233,226,0.12)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="1080" height="48" rx="12" fill="#16181f"/>
    <rect y="36" width="1080" height="12" fill="#16181f"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(236,233,226,0.08)" stroke-width="1"/>

    <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="24" r="6" fill="#27c93f"/>

    <rect x="360" y="10" width="360" height="28" rx="6" fill="#0d0e12" stroke="rgba(236,233,226,0.08)"/>
    <text x="540" y="28" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle">pitch.propscale.io/deal-pipeline</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="622" fill="#0e1014"/>
      <line x1="220" y1="0" x2="220" y2="622" stroke="rgba(236,233,226,0.08)"/>

      <text x="24" y="38" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">PropScale B2B</text>
      <text x="24" y="56" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">VENTURE PITCH &amp; CRE DECK</text>

      <rect x="16" y="80" width="188" height="34" rx="6" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.3)"/>
      <text x="36" y="102" fill="#d4af37" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">CRE Deal Pipeline</text>

      <text x="36" y="146" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">TAM / SAM / SOM ($14B)</text>
      <text x="36" y="186" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Unit Economics (CAC/LTV)</text>
      <text x="36" y="226" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Asset Due Diligence</text>
      <text x="36" y="266" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Interactive Figma MVP</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(250, 72)">
      <text x="0" y="24" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="22">Commercial Real Estate Deal Flow &amp; TAM</text>
      <text x="0" y="46" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="13">B2B acquisition pipeline modeling, transaction velocity &amp; market sizing</text>

      <!-- KPI Cards -->
      <g transform="translate(0, 68)">
        <rect width="245" height="96" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="18" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Market Opportunity</text>
        <text x="18" y="64" fill="#d4af37" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">$14B TAM</text>
        <text x="18" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">Indian PropTech Sector</text>

        <rect x="265" width="245" height="96" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="283" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Unit Economic Ratio</text>
        <text x="283" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">4.2x LTV/CAC</text>
        <text x="283" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">11-month payback model</text>

        <rect x="530" width="265" height="96" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="548" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Pipeline Deal Volume</text>
        <text x="548" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">₹42.5 Cr</text>
        <text x="548" y="84" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11">Active commercial assets</text>
      </g>

      <!-- Deal Columns / Kanban Preview -->
      <g transform="translate(0, 186)">
        <!-- Stage 1 -->
        <rect width="250" height="385" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="18" y="32" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="13">Due Diligence (12)</text>
        <rect x="18" y="48" width="214" height="90" rx="6" fill="#1c1f28" stroke="rgba(236,233,226,0.06)"/>
        <text x="32" y="74" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">BKC Tower Grade-A Office</text>
        <text x="32" y="94" fill="#d4af37" font-family="-apple-system, system-ui, sans-serif" font-size="11">₹18.5 Cr · 12,000 sq.ft</text>

        <rect x="18" y="150" width="214" height="90" rx="6" fill="#1c1f28" stroke="rgba(236,233,226,0.06)"/>
        <text x="32" y="176" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">Andheri Tech Park Space</text>
        <text x="32" y="196" fill="#d4af37" font-family="-apple-system, system-ui, sans-serif" font-size="11">₹8.2 Cr · 6,500 sq.ft</text>

        <!-- Stage 2 -->
        <rect x="270" width="250" height="385" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="288" y="32" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="13">Term Sheet Issued (5)</text>
        <rect x="288" y="48" width="214" height="90" rx="6" fill="#1c1f28" stroke="rgba(236,233,226,0.06)"/>
        <text x="302" y="74" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">Lower Parel Co-working Hub</text>
        <text x="302" y="94" fill="#d4af37" font-family="-apple-system, system-ui, sans-serif" font-size="11">₹14.0 Cr · 10,200 sq.ft</text>

        <!-- Stage 3 -->
        <rect x="540" width="255" height="385" rx="8" fill="#16181f" stroke="rgba(236,233,226,0.08)"/>
        <text x="558" y="32" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="13">Closed &amp; Deployed (8)</text>
        <rect x="558" y="48" width="219" height="90" rx="6" fill="#1c1f28" stroke="rgba(118,158,132,0.2)"/>
        <text x="572" y="74" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">Navi Mumbai Logistics Yard</text>
        <text x="572" y="94" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">₹22.0 Cr · Fully Leased</text>
      </g>
    </g>
  </g>
</svg>
