<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e0d"/>
      <stop offset="50%" stop-color="#141412"/>
      <stop offset="100%" stop-color="#090908"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb6d51"/>
      <stop offset="100%" stop-color="#e08a70"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cb6d51" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cb6d51" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Window Container -->
  <g transform="translate(60, 40)">
    <!-- Window Frame -->
    <rect width="1080" height="670" rx="12" fill="#131311" stroke="rgba(236,233,226,0.12)" stroke-width="1.5"/>
    
    <!-- Window Titlebar -->
    <rect width="1080" height="48" rx="12" fill="#181816"/>
    <rect y="36" width="1080" height="12" fill="#181816"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="rgba(236,233,226,0.08)" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="24" r="6" fill="#27c93f"/>

    <!-- URL Bar -->
    <rect x="360" y="10" width="360" height="28" rx="6" fill="#0e0e0d" stroke="rgba(236,233,226,0.08)"/>
    <text x="540" y="28" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12" text-anchor="middle">app.opspulse.internal/sla-bottlenecks</text>

    <!-- Sidebar -->
    <g transform="translate(0, 48)">
      <rect width="220" height="622" fill="#11110f"/>
      <line x1="220" y1="0" x2="220" y2="622" stroke="rgba(236,233,226,0.08)"/>

      <text x="24" y="38" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">OpsPulse AI</text>
      <text x="24" y="56" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">OPERATIONS INTELLIGENCE</text>

      <!-- Nav Items -->
      <rect x="16" y="80" width="188" height="34" rx="6" fill="rgba(203,109,81,0.12)" stroke="rgba(203,109,81,0.3)"/>
      <text x="36" y="102" fill="#cb6d51" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="12">SLA Diagnostic Engine</text>

      <text x="36" y="146" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Client Churn Forecast</text>
      <text x="36" y="186" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Cross-Team Pipelines</text>
      <text x="36" y="226" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Data Validation Rules</text>
      <text x="36" y="266" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="12">Executive Reports</text>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(250, 72)">
      <!-- Header -->
      <text x="0" y="24" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="22">Cross-Functional SLA Bottlenecks</text>
      <text x="0" y="46" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="13">Real-time resolution diagnostic across Sales, Support, and Tech squads</text>

      <!-- KPI Cards -->
      <g transform="translate(0, 68)">
        <!-- Card 1 -->
        <rect width="245" height="96" rx="8" fill="#181816" stroke="rgba(236,233,226,0.08)"/>
        <text x="18" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Avg Resolution SLA</text>
        <text x="18" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">14.2 hrs</text>
        <text x="18" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">↓ -31.4% vs last quarter</text>

        <!-- Card 2 -->
        <rect x="265" width="245" height="96" rx="8" fill="#181816" stroke="rgba(236,233,226,0.08)"/>
        <text x="283" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Data Accuracy Score</text>
        <text x="283" y="64" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">98.6%</text>
        <text x="283" y="84" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="11">↑ +72% verification</text>

        <!-- Card 3 -->
        <rect x="530" width="265" height="96" rx="8" fill="#181816" stroke="rgba(236,233,226,0.08)"/>
        <text x="548" y="30" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-transform="uppercase">Active CRM Portfolios</text>
        <text x="548" y="64" fill="#cb6d51" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="26">154 Accounts</text>
        <text x="548" y="84" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11">Zero missed follow-ups</text>
      </g>

      <!-- Chart Panel -->
      <g transform="translate(0, 186)">
        <rect width="795" height="230" rx="8" fill="#181816" stroke="rgba(236,233,226,0.08)"/>
        <text x="24" y="32" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="14">SLA Turnaround Reduction Trend (2025)</text>

        <!-- Chart Grid Lines -->
        <line x1="24" y1="70" x2="770" y2="70" stroke="rgba(236,233,226,0.05)"/>
        <line x1="24" y1="120" x2="770" y2="120" stroke="rgba(236,233,226,0.05)"/>
        <line x1="24" y1="170" x2="770" y2="170" stroke="rgba(236,233,226,0.05)"/>

        <!-- Area Curve -->
        <path d="M 40 180 Q 180 160 300 130 T 520 90 T 750 60 L 750 200 L 40 200 Z" fill="url(#chart)"/>
        <!-- Line -->
        <path d="M 40 180 Q 180 160 300 130 T 520 90 T 750 60" fill="none" stroke="#cb6d51" stroke-width="3"/>
        <circle cx="750" cy="60" r="5" fill="#cb6d51"/>

        <!-- Months -->
        <text x="40" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Jul</text>
        <text x="180" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Aug</text>
        <text x="320" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Sep</text>
        <text x="460" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Oct</text>
        <text x="600" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Nov</text>
        <text x="740" y="215" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="10">Dec</text>
      </g>

      <!-- Bottom Recent Incidents Table -->
      <g transform="translate(0, 436)">
        <rect width="795" height="135" rx="8" fill="#181816" stroke="rgba(236,233,226,0.08)"/>
        <text x="24" y="28" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="13">High-Impact Pipeline Interventions</text>

        <line x1="24" y1="44" x2="770" y2="44" stroke="rgba(236,233,226,0.08)"/>

        <text x="24" y="68" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-size="12">#OP-1049 · Future Real Estate Handoff</text>
        <rect x="360" y="55" width="65" height="18" rx="4" fill="rgba(118,158,132,0.15)"/>
        <text x="392" y="68" fill="#769e84" font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">Resolved</text>
        <text x="750" y="68" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-anchor="end">2.1h turnaround</text>

        <line x1="24" y1="84" x2="770" y2="84" stroke="rgba(236,233,226,0.04)"/>

        <text x="24" y="108" fill="#ece9e2" font-family="-apple-system, system-ui, sans-serif" font-size="12">#OP-1052 · Enterprise Tenant CRM Sync</text>
        <rect x="360" y="95" width="70" height="18" rx="4" fill="rgba(203,109,81,0.15)"/>
        <text x="395" y="108" fill="#cb6d51" font-family="-apple-system, system-ui, sans-serif" font-size="10" text-anchor="middle">Optimized</text>
        <text x="750" y="108" fill="#8d8a83" font-family="-apple-system, system-ui, sans-serif" font-size="11" text-anchor="end">Automated</text>
      </g>
    </g>
  </g>
</svg>
